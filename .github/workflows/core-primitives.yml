name: Core primitives

on:
  pull_request:
    paths:
      - "crates/skill-studio-core/**"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/Cargo.lock"
      - "apps/desktop/src-tauri/src/skills/mod.rs"
      - ".github/workflows/core-primitives.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-primitives-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "1"
    defaults:
      run:
        shell: bash
        working-directory: crates/skill-studio-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test shared core
        run: cargo test --locked 2>&1 | tee "$RUNNER_TEMP/core-tests.log"
      - name: Retain test results briefly
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-tests
          path: ${{ runner.temp }}/core-tests.log
          retention-days: 3
          if-no-files-found: ignore
