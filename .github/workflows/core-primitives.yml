name: Core primitives

on:
  pull_request:
    paths:
      - "crates/skill-studio-core/**"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/Cargo.lock"
      - "apps/desktop/src-tauri/src/skills/mod.rs"
      - ".github/workflows/core-primitives.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-primitives-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "1"
    defaults:
      run:
        working-directory: crates/skill-studio-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
