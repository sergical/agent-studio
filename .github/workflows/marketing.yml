name: Marketing

on:
  pull_request:
    paths:
      - "packages/marketing/**"
      - "package.json"
      - "package-lock.json"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - "tools/oxlint/**"
      - "tools/verification/verify-web-observability-build.py"
      - "tools/verification/marketing-browser-fixture.mjs"
      - ".github/workflows/marketing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  marketing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      VITE_SENTRY_DSN: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck -w @skill-studio/marketing
      - run: npx --no-install oxlint packages/marketing/src/main.tsx packages/marketing/src/marketing-*.ts packages/marketing/vitest.config.ts tools/verification/marketing-browser-fixture.mjs --deny-warnings
      - run: npx --no-install oxfmt --check packages/marketing/src/main.tsx packages/marketing/src/marketing-*.ts packages/marketing/vitest.config.ts packages/marketing/package.json .github/workflows/marketing.yml
      - name: Marketing tests
        run: npm run test -w @skill-studio/marketing -- --maxWorkers=1 --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/marketing-tests.xml"
      - run: npm run build -w @skill-studio/marketing
      - name: Build private observability artifacts
        run: npm run build:observability -w @skill-studio/marketing
        env:
          VITE_SENTRY_DSN: https://public@example.invalid/1
          VITE_SENTRY_RELEASE: marketing-ci-fixture
          VITE_SENTRY_ENVIRONMENT: test
          VITE_SENTRY_TRACES_SAMPLE_RATE: "1"
      - name: Verify private source maps
        run: python3 tools/verification/verify-web-observability-build.py --surface marketing --build-root packages/marketing/dist-observability --release marketing-ci-fixture --dsn https://public@example.invalid/1 --output "$RUNNER_TEMP/marketing-build.json"
      - name: Retain test report briefly
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marketing-test-report
          path: ${{ runner.temp }}/marketing-tests.xml
          retention-days: 3
          if-no-files-found: ignore
