name: Deploy Server

# CI owns the hosted skills.sh proxy's deploy: the Worker is live, so every
# merge that touches apps/server lands by itself and this run records the
# commit that is serving production (re-run it to roll back). The skills.sh
# key itself is never in this workflow: it's set once by hand with
# `wrangler secret put SKILLS_SH_API_KEY` (see apps/server/README.md).
on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time: a new run waits for the one in flight instead of
# racing it, and only the newest pending commit survives, so an earlier merge
# can't finish last and leave an older commit serving production.
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w @skill-studio/server
      - name: Deploy to Cloudflare Workers
        working-directory: apps/server
        # The deployed commit is injected as a Worker variable so the live
        # version is readable from `GET /version`, not just this run's history.
        run: npx wrangler deploy --var SKILL_STUDIO_SERVER_VERSION:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
