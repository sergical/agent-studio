name: Deploy Server

# Manual only for now - no push trigger until the hosted URL has been
# rehearsed. The skills.sh key itself is never in this workflow: it's set
# once by hand with `wrangler secret put SKILLS_SH_API_KEY` (see
# apps/server/README.md).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w @skill-studio/server
      - name: Deploy to Cloudflare Workers
        working-directory: apps/server
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
