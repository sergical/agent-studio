name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/release/check-version-matches-tag.sh "${{ github.ref_name }}"

  build:
    needs: check-version
    runs-on: macos-14
    # tauri-action creates the GitHub release and `gh release upload` attaches
    # the .dSYM archive; the default GITHUB_TOKEN is read-only.
    permissions:
      contents: write
    strategy:
      # tauri-action's own `latest.json` merge (from `includeUpdaterJson`) is
      # a non-atomic download-edit-upload against the same release: two
      # matrix legs finishing at once can each read the other's not-yet-
      # uploaded state and clobber it. One leg at a time keeps that merge
      # race-free.
      max-parallel: 1
      # A failure on one architecture must not cancel the other leg still
      # running - each leg uploads its own artifacts to the same release,
      # so the surviving leg's build is still worth finishing and shipping.
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compute the release version
        # A pre-release tag's base version (e.g. "0.1.0" from
        # "v0.1.0-rc.1") is what CHANGELOG.md and the committed
        # tauri.conf.json/package.json versions carry - see
        # check-version-matches-tag.sh. The full tag version is what the
        # built app itself reports, stamped in below via
        # tauri.release.conf.json so rc.1 < rc.2 < 0.1.0 in semver for the
        # updater. A plain "vX.Y.Z" tag has no suffix, so full == base.
        run: |
          set -euo pipefail
          full="${GITHUB_REF_NAME#v}"
          base="${full%%-*}"
          echo "RELEASE_VERSION=$full" >> "$GITHUB_ENV"
          echo "RELEASE_BASE_VERSION=$base" >> "$GITHUB_ENV"
      - name: Check CHANGELOG.md has a section for this tag
        run: |
          set -euo pipefail
          grep -qE "^## v${RELEASE_BASE_VERSION}( |$)" CHANGELOG.md || {
            echo "CHANGELOG.md has no section for v${RELEASE_BASE_VERSION}"
            exit 1
          }
      - name: Stamp the release version into the release-only Tauri config
        run: |
          set -euo pipefail
          jq --arg v "$RELEASE_VERSION" '.version = $v' apps/desktop/src-tauri/tauri.release.conf.json > /tmp/tauri.release.conf.json
          mv /tmp/tauri.release.conf.json apps/desktop/src-tauri/tauri.release.conf.json
      - name: Configure Apple code signing
        # Apple's own tooling (tauri-bundler's sign.rs) checks these
        # variables with `var_os`, so an empty string still counts as
        # "set" and `security import`s an empty file. They must be
        # entirely ABSENT from the build step's environment when the
        # certificate secret is empty, which is why this step (not the
        # build step's own `env:`) is the only place that ever writes them,
        # and only inside this `if`. `$GITHUB_ENV` receives them - never
        # `echo`d to stdout - and the heredoc form guards a multi-line
        # secret (the .p12 is base64, expected to be one line, but this
        # doesn't assume it).
        run: |
          set -euo pipefail
          if [ -n "$APPLE_CERTIFICATE" ]; then
            delimiter="$(openssl rand -hex 16)"
            {
              echo "APPLE_CERTIFICATE<<$delimiter"
              echo "$APPLE_CERTIFICATE"
              echo "$delimiter"
              echo "APPLE_CERTIFICATE_PASSWORD<<$delimiter"
              echo "$APPLE_CERTIFICATE_PASSWORD"
              echo "$delimiter"
              echo "APPLE_SIGNING_IDENTITY=Developer ID Application"
              echo "KEYCHAIN_PASSWORD<<$delimiter"
              echo "$APPLE_KEYCHAIN_PASSWORD"
              echo "$delimiter"
              echo "APPLE_ID<<$delimiter"
              echo "$APPLE_ID"
              echo "$delimiter"
              echo "APPLE_PASSWORD<<$delimiter"
              echo "$APPLE_APP_SPECIFIC_PASSWORD"
              echo "$delimiter"
              echo "APPLE_TEAM_ID<<$delimiter"
              echo "$APPLE_TEAM_ID"
              echo "$delimiter"
            } >> "$GITHUB_ENV"
            echo "Apple code signing secrets present - build will sign and notarize."
          else
            echo "Apple code signing secrets are unset - building an unsigned rehearsal."
          fi
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Injected into build.rs via SKILL_STUDIO_COMMIT so the built app
          # and CLI report the commit they were built from (unit 6.6).
          SKILL_STUDIO_COMMIT: ${{ github.sha }}
          # Compiled into the release binary's default server URL (see
          # `default_server_url` in api.rs) - an unset repo variable keeps
          # the `http://127.0.0.1:8787` local-dev default.
          SKILL_STUDIO_SERVER_URL: ${{ vars.SKILL_STUDIO_SERVER_URL }}
          # Apple's APPLE_CERTIFICATE/APPLE_SIGNING_IDENTITY/etc. are
          # deliberately NOT set here - see "Configure Apple code signing"
          # above, which appends them to $GITHUB_ENV (so they still reach
          # this step) only when the certificate secret is non-empty.
          #
          # Minisign key pair for the in-app updater (unit 6.2): the public
          # half is committed in tauri.conf.json; the private half signs
          # every updater artifact tauri-action builds here.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          # tauri.release.conf.json (stamped with this run's version above)
          # turns on createUpdaterArtifacts only for this CI build - see
          # that file's own comment for why it isn't in the base config.
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: "Skill Studio ${{ github.ref_name }}"
          releaseDraft: false
          # A tag with a pre-release suffix (e.g. v0.1.0-rc.1) publishes as a
          # GitHub pre-release; a plain vX.Y.Z tag publishes normally.
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true

      # The workspace's [profile.release] sets split-debuginfo = "packed", so
      # cargo writes the app binary's .dSYM beside the binary in the root
      # cargo workspace's target/<triple>/release/ (apps/desktop/src-tauri is
      # a workspace member, not its own workspace - see the root Cargo.toml's
      # [workspace] members - so there is no apps/desktop/src-tauri/target),
      # not under bundle/macos, which only holds the .app and DMG. Zip it so
      # it survives upload as a plain file and stays paired with its DMG by
      # name.
      - name: Package debug symbols
        run: |
          set -euo pipefail
          release_dir="target/${{ matrix.target }}/release"
          # mainBinaryName in tauri.conf.json is the app binary; cargo names
          # its .dSYM after that binary file name, not the package name.
          dsym_path="$release_dir/skill-studio-desktop.dSYM"
          if [[ ! -d "$dsym_path" ]]; then
            echo "no skill-studio-desktop.dSYM found under $release_dir; check [profile.release] in Cargo.toml" >&2
            echo "found instead:" >&2
            ls -d "$release_dir"/*.dSYM >&2 || true
            exit 1
          fi
          zip_path="$release_dir/skill-studio-${{ matrix.target }}.dSYM.zip"
          ditto -c -k --sequesterRsrc "$dsym_path" "$zip_path"
          echo "dsym_zip=$zip_path" >> "$GITHUB_ENV"

      - name: Attach debug symbols to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "$dsym_zip" --clobber

  # Unit 6.3: prints the rollback rehearsal checklist once per release
  # (not once per `build` matrix leg) so the release author has one place
  # to record it. This is a summary, not a gate - nothing here blocks the
  # release or waits on wall-clock time; the release author fills in the
  # result by hand, after actually running the steps against a machine
  # that ran the previous tag, and copies this section into the release
  # notes (`docs/action-map/release-readiness.md` carries the same steps).
  rehearsal-summary:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Print the n-1 over n rollback rehearsal checklist
        run: |
          {
            echo "## Rollback rehearsal (n-1 over n)"
            echo
            echo "Run by hand on a Mac that already ran the previous tag, before announcing this release:"
            echo
            echo "- [ ] Install the previous tag's signed DMG and launch it at least once."
            echo "- [ ] Install this tag's signed DMG over it (same Applications path)."
            echo "- [ ] Launch, confirm the app opens to the normal skill list, not the newer-data-folder message."
            echo "- [ ] Note the app data folder's \`schema_version\` before and after (\`~/Library/Application Support/<bundle id>/schema_version\`)."
            echo "- [ ] Reinstall the previous tag's DMG over this one (the rollback), launch, and record what the user sees."
            echo
            echo "Result: (fill in)"
          } >> "$GITHUB_STEP_SUMMARY"
