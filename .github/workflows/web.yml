name: Web

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run doctor
      - run: npm run test
      - name: Typecheck server package
        run: npm run typecheck -w @skill-studio/server
      - name: Typecheck shared library
        run: npm run typecheck -w @skill-studio/lib
      - name: Typecheck marketing site
        run: npm run typecheck -w @skill-studio/marketing
      - name: Build marketing site
        run: npm run build -w @skill-studio/marketing
      - name: Build desktop frontend
        run: npm run build -w skill-studio
