[package]
name = "skill-studio-host"
version = "0.1.0"
edition = "2021"
description = "Real-world adapters (filesystem, clock, ids, leases, notices) for skill-studio-core"
license = "MIT"
publish = false

[lib]
name = "skill_studio_host"
path = "src/lib.rs"

[dependencies]
skill-studio-core = { path = "../skill-studio-core" }
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
