[package]
name = "skill-studio-telemetry"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sentry-types = "=0.49.2"
sentry-core = { version = "=0.49.2", default-features = false, features = ["client", "logs", "metrics"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
sentry-tracing = { version = "=0.49.2", features = ["logs"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry"] }

[dev-dependencies]
sentry = { version = "=0.49.2", default-features = false, features = ["test", "tracing", "logs", "metrics"] }
