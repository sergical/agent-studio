[package]
name = "skill-studio"
version = "0.1.0"
description = "Manage coding assistant configurations"
authors = ["you"]
edition = "2021"
# `tauri dev` runs plain `cargo run`; with two bins (this one and `schema`)
# cargo needs to be told which one is the app.
default-run = "skill-studio-desktop"

# The CLI at apps/cli also publishes a binary called `skill-studio`.
# Both crates write into the one workspace target directory, so without
# an explicit name here the two builds overwrite each other and
# `target/debug/skill-studio` is whichever crate compiled last.
[[bin]]
name = "skill-studio-desktop"
path = "src/main.rs"

[lib]
name = "skill_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "5"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2"
tiktoken-rs = "0.12.0"
sha2 = "0.11.0"
toml = "1.1.4"
# Format-preserving TOML edits for ~/.codex/config.toml - pinned to the
# version already resolved transitively (see Cargo.lock) so this doesn't
# introduce a second copy of the crate.
toml_edit = "0.23.10"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
notify = "6"
notify-debouncer-mini = "0.4"
libc = "0.2"
# 0.37 does not exist on crates.io as of writing; 0.40.2 is the newest
# available in the 0.3x/0.4x line, per spec's fallback instruction.
rusqlite = { version = "0.40", features = ["bundled"] }
ulid = "1"
skill-studio-core = { path = "../../../crates/skill-studio-core" }
skill-studio-host = { path = "../../../crates/skill-studio-host" }
schemars = { version = "1", features = ["chrono04"] }

[dev-dependencies]
tempfile = "3"
skill-studio-core = { path = "../../../crates/skill-studio-core", features = ["testing"] }
similar = "2"
